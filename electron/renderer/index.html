<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>v86 Electron</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000;
            color: #c8f1ff;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #screen {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #hud {
            position: fixed;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(200, 241, 255, 0.25);
            border-radius: 8px;
            backdrop-filter: blur(6px);
        }
        #status {
            min-width: 200px;
            font-weight: 600;
            color: #8be9ff;
        }
        button {
            background: #0b87c9;
            border: 1px solid #0a74ad;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #hint {
            position: fixed;
            bottom: 12px;
            left: 12px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(200, 241, 255, 0.25);
            border-radius: 8px;
            max-width: 420px;
            line-height: 1.4;
        }
        a { color: #8be9ff; }
    </style>
</head>
<body>
    <div id="screen"></div>
    <div id="hud">
        <span id="status">Idle</span>
        <button id="start">Start</button>
        <button id="stop" disabled>Stop</button>
        <button id="fullscreen">Fullscreen</button>
    </div>
    <div id="hint">Uses local assets if present (build/v86*.wasm, bios/, images/). Falls back to copy.sh if missing.</div>
    <script type="module" src="./index.js"></script>
</body>
</html>
